spring:
  profiles.active: inmemory
  datasource:
    driver-class-name: org.h2.Driver
    username: sa
    password: password
  jpa.database-platform: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: true
      path: /h2-console

---

spring:
  # noinspection SpringBootApplicationYaml
  profiles.activate.on-profile: standalone
  datasource.url: jdbc:h2:file:./todolistdb;DB_CLOSE_ON_EXIT=FALSE;AUTO_SERVER=TRUE
  jpa.hibernate.ddl-auto: update

---

spring:
  # noinspection SpringBootApplicationYaml
  profiles.activate.on-profile: inmemory
  datasource.url: jdbc:h2:mem:todolistdb
  jpa.hibernate.ddl-auto: create-drop


---